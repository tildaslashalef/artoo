# artoo guest baseline prompt — Gruvbox; paired with fish config.fish colors.
add_newline = true
format = "$username$hostname$directory$git_branch$git_status$cmd_duration$line_break$character"

[username]
show_always = true
style_root = "bold red"
format = "[$user]($style)@"

[hostname]
ssh_only = false
format = "[$hostname](bold #8ec07c) "

[directory]
style = "bold #83a598"
truncation_length = 4

[git_branch]
style = "bold #d3869b"

[character]
success_symbol = "[→](#b8bb26)"
error_symbol = "[→](#fb4934)"
