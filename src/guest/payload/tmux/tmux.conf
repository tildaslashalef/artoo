# artoo guest baseline tmux — Linux adaptation of the author's tmux configuration.
# Shared provisioning payload: secret-free, Mac-independent.
set -g default-shell /usr/bin/fish
set -g prefix C-b
bind C-b send-prefix
set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-ghostty:RGB"
set -as terminal-features ",xterm-256color:RGB"
set -as terminal-features ",tmux-256color:RGB"
set -as terminal-overrides ",*:Smulx=\E[4::%p1%dm"
set -as terminal-overrides ",*:Setulc=\E[58::2::%p1%{65536}%/%d::%p1%{255}%&%d::%p1%{255}%&%d%;m"
set -as terminal-overrides ",*:sitm=\E[3m,ritm=\E[23m"
set -sg escape-time 0
set -g focus-events on
set -g mouse on
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g history-limit 50000
setw -g aggressive-resize on
setw -g mode-keys vi
set -g pane-border-style "fg=#504945"
set -g pane-active-border-style "fg=#b8bb26,bold"
set -g status-position bottom
set -g status-interval 5
set -g status-justify left
set -g status-style "bg=#1d2021,fg=#a89984"
set -g status-left-length 40
set -g status-left "#[bg=#8ec07c,fg=#1d2021,bold]  #S  #[bg=#1d2021,fg=#8ec07c]"
set -g status-right-length 100
set -g status-right "#[fg=#fe8019]#{?SSH_CONNECTION, SSH ,}#[fg=#fabd2f]#{?window_zoomed_flag, ZOOM ,}#[fg=#a89984] %H:%M  %d-%b "
set -g window-status-separator ""
setw -g window-status-format " #[fg=#7c6f64]#I #[fg=#a89984]#W#F "
setw -g window-status-current-format "#[bg=#fabd2f,fg=#1d2021,bold] #I #W#F #[bg=#1d2021,fg=#fabd2f]"
setw -g window-status-last-style "fg=#d5c4a1"
setw -g window-status-activity-style "fg=#1d2021,bg=#fb4934,bold"
setw -g window-status-bell-style "fg=#1d2021,bg=#fb4934,bold"
setw -g monitor-activity on
set -g visual-activity off
set -g visual-bell off

bind r source-file ~/.config/tmux/tmux.conf \; display-message "tmux config reloaded"
bind c new-window -c "#{pane_current_path}"
bind -r n next-window
bind -r p previous-window
bind , command-prompt -I "#W" "rename-window -- '%%'"
bind X confirm-before -p "kill-window #W? (y/n)" kill-window
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R
bind z resize-pane -Z
bind x confirm-before -p "kill-pane #P? (y/n)" kill-pane
bind o rotate-window
bind "}" swap-pane -D
bind "{" swap-pane -U
bind D detach-client
bind s choose-tree -s
bind C new-session -c "#{pane_current_path}"
set -g set-clipboard on
# copy-mode-vi: v starts selection, y copies and exits
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi y send-keys -X copy-selection-and-cancel
bind -T copy-mode-vi Enter send-keys -X copy-selection-and-cancel
