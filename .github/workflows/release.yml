# artoo release binaries (docs/RELEASING.md): on a pushed v* tag, check
# that it is an annotated tag on main, run `make test`'s checks, build the
# release archives (scripts/release-binaries.sh) and attach them to the
# tag's GitHub release, creating it with generated notes if it does not
# exist yet.
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  binaries:
    # macOS cross-compiles every target (artoo links no libc) and can run
    # the macOS binaries as a smoke test.
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      # Full history and tags: the version is derived from the tag
      # (git describe), and the tag must be on main.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: mlugg/setup-zig@v2
        with:
          version: 0.17.0

      - name: Annotated tag on main
        run: |
          test "$(git cat-file -t "$GITHUB_REF_NAME")" = tag || { echo "$GITHUB_REF_NAME is not an annotated tag"; exit 1; }
          git merge-base --is-ancestor HEAD origin/main || { echo "$GITHUB_REF_NAME is not on main"; exit 1; }

      - name: Checks
        timeout-minutes: 15
        run: zig build test fmt cross --summary all

      - name: Archives
        timeout-minutes: 15
        run: |
          scripts/release-binaries.sh dist
          tar -xzOf dist/artoo-*-aarch64-macos.tar.gz '*/artoo' > artoo-smoke
          chmod +x artoo-smoke
          got=$(./artoo-smoke --version)
          test "$got" = "artoo ${GITHUB_REF_NAME#v}" || { echo "built '$got' for tag $GITHUB_REF_NAME"; exit 1; }

      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # vX.Y.Z-rc.N and other SemVer pre-releases are marked as such.
          pre=; case "$GITHUB_REF_NAME" in *-*) pre=--prerelease ;; esac
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 ||
            gh release create "$GITHUB_REF_NAME" --title "artoo ${GITHUB_REF_NAME#v}" --generate-notes --verify-tag $pre
          gh release upload "$GITHUB_REF_NAME" dist/* --clobber
